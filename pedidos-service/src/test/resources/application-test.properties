# Perfil de pruebas: no necesita AWS RDS ni variables de entorno
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# RabbitMQ no es necesario para las pruebas: los listeners no arrancan
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.addresses=localhost:5672
spring.rabbitmq.connection-timeout=500ms
