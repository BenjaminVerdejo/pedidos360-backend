spring.application.name=pedidos-service

# Conexión a RDS (usando variables de entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Seguridad JWT - Azure AD
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0

# Audiencia del token (Client ID de Azure o Uri del API)
spring.security.oauth2.resourceserver.jwt.audiences=api://82adc866-3948-44f8-993d-5658734ad794