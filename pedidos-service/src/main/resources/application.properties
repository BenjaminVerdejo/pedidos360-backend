server.port=8080
spring.application.name=pedidos-service

# --- Base de datos en AWS RDS (PostgreSQL) ---
# Se leen SOLO de variables de entorno (ver .env.example). Sin valores por defecto para
# host ni contrasena: si faltan, la aplicacion no arranca (falla segura).
#   DB_HOST, DB_USER, DB_PASSWORD  (y opcional DB_PORT, DB_NAME)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# validate: Hibernate verifica el esquema pero NO lo modifica en produccion.
# Para crear las tablas en una base nueva: JPA_DDL_AUTO=update solo en el primer despliegue.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# --- Validacion del JWT de Azure AD ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=82adc866-3948-44f8-993d-5658734ad794

# --- CORS (en AWS: CORS_ALLOWED_ORIGINS=https://tu-front,https://tu-api-gateway) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Manejo de errores: nunca exponer trazas ni mensajes internos al cliente (CWE-209) ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# Limite de tamano de peticiones (mitiga abuso por payloads gigantes)
server.tomcat.max-swallow-size=1MB
server.max-http-request-header-size=16KB


# --- RabbitMQ ---
# Cluster de 2 nodos (docker-compose): si un nodo cae, se conecta al otro
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD}

# --- Nombres de exchanges, colas y routing keys (unico lugar donde se escriben) ---
# topic: enruta por patron (pedido.#) | direct: enruta por clave exacta | dlx: mensajes fallidos
app.rabbit.exchange=pedidos.exchange
app.rabbit.direct-exchange=pedidos.direct
app.rabbit.dlx=pedidos.dlx
app.rabbit.routing.pedido-creado=pedido.creado
app.rabbit.routing.pedido-estado=pedido.estado.cambiado
app.rabbit.routing.pedido-entregado=pedido.entregado
app.rabbit.notificaciones.queue=notificaciones.queue
app.rabbit.notificaciones.dlq=notificaciones.dlq
app.rabbit.notificaciones.binding-key=pedido.#
app.rabbit.tickets.queue=tickets.queue
app.rabbit.tickets.dlq=tickets.dlq
app.rabbit.tickets.binding-key=pedido.creado
# documentos: comprobante de entrega (exchange DIRECT)
app.rabbit.documentos.queue=documentos.queue
app.rabbit.documentos.dlq=documentos.dlq
app.rabbit.documentos.binding-key=pedido.entregado

# --- Consumidores: manejo de ACK, reintentos y DLQ ---
# ACK manual: cada consumidor confirma (ack) o rechaza (nack) explicitamente
app.rabbit.consumidor.prefetch=10
# reintentos ante errores recuperables antes de mandar el mensaje a la DLQ
app.rabbit.consumidor.max-reintentos=3
app.rabbit.consumidor.espera-ms=1000

# --- Kafka (streaming de eventos de pedidos) ---
# Cluster de 3 brokers (docker-compose, perfil "kafka"). Desde el host: localhost:29092..29094;
# dentro de Docker: kafka1:9092,kafka2:9092,kafka3:9092 (variable KAFKA_BOOTSTRAP_SERVERS).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093,localhost:29094}
spring.kafka.client-id=pedidos-service
# Serializacion: clave = id del pedido (String), valor = DTO en JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Alias de tipo en la cabecera __TypeId__: el consumidor mapea el alias a su propio DTO
# (los servicios no comparten clases Java, solo el contrato del evento)
spring.kafka.producer.properties.spring.json.type.mapping=pedidoCreado:com.example.demo.messaging.kafka.dto.PedidoCreadoEvento,estadoCambiado:com.example.demo.messaging.kafka.dto.EstadoPedidoCambiadoEvento
# Durabilidad: acks=all + min.insync.replicas=2 -> el evento queda en al menos 2 brokers
spring.kafka.producer.acks=all
# Productor idempotente: los reintentos no generan duplicados ni desordenan la particion
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# Si el cluster no responde, send() no bloquea la peticion HTTP mas de 3 s
spring.kafka.producer.properties.max.block.ms=3000
# Rendimiento: agrupa mensajes hasta 10 ms y los comprime
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.batch-size=32768
spring.kafka.producer.compression-type=gzip

# Parametros de administracion de los topicos (ver KafkaTopicosConfig)
app.kafka.habilitado=${KAFKA_HABILITADO:true}
app.kafka.particiones=3
app.kafka.replicas=3
app.kafka.min-insync-replicas=2
# pedidos-creados: 7 dias | DLT: 14 dias (tiempo para investigar mensajes fallidos)
app.kafka.retencion-creados-ms=604800000
app.kafka.retencion-dlt-ms=1209600000

# Si el cluster Kafka no responde al arrancar, no retrasar el inicio mas de 10 s
spring.kafka.admin.operation-timeout=10s
spring.kafka.admin.fail-fast=false
