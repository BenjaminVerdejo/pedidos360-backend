server.port=8080
spring.application.name=pedidos-service

# --- Base de datos en AWS RDS (PostgreSQL) ---
# Se leen de variables de entorno para no subir credenciales a GitHub:
#   DB_HOST, DB_USER, DB_PASSWORD  (y opcional DB_PORT, DB_NAME)
spring.datasource.url=jdbc:postgresql://${DB_HOST:pedidos360-db.cvcrt5gnxhnz.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Validacion del JWT de Azure AD ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=82adc866-3948-44f8-993d-5658734ad794

# --- CORS (en AWS: CORS_ALLOWED_ORIGINS=https://tu-front,https://tu-api-gateway) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health


# --- RabbitMQ ---
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:admin123}

# --- Nombres de exchanges, colas y routing keys (unico lugar donde se escriben) ---
app.rabbit.exchange=pedidos.exchange
app.rabbit.dlx=pedidos.dlx
app.rabbit.routing.pedido-creado=pedido.creado
app.rabbit.routing.pedido-estado=pedido.estado.cambiado
app.rabbit.notificaciones.queue=notificaciones.queue
app.rabbit.notificaciones.dlq=notificaciones.dlq
app.rabbit.notificaciones.binding-key=pedido.#
app.rabbit.tickets.queue=tickets.queue
app.rabbit.tickets.dlq=tickets.dlq
app.rabbit.tickets.binding-key=pedido.creado

# --- Consumidores: manejo de ACK, reintentos y DLQ ---
# ACK manual: cada consumidor confirma (ack) o rechaza (nack) explicitamente
app.rabbit.consumidor.prefetch=10
# reintentos ante errores recuperables antes de mandar el mensaje a la DLQ
app.rabbit.consumidor.max-reintentos=3
app.rabbit.consumidor.espera-ms=1000
