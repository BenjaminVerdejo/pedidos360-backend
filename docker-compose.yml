# Pedidos360 - entorno local / CI
#
#   docker compose up -d                      -> solo cluster RabbitMQ de 2 nodos
#   docker compose --profile app up -d --build -> RabbitMQ + PostgreSQL + los 3 microservicios
#
#   Nodo 1: AMQP 5672  | consola http://localhost:15672
#   Nodo 2: AMQP 5673  | consola http://localhost:15673
#
# Las credenciales se leen del archivo .env (copiar .env.example -> .env).
# Ya NO existen contrasenas por defecto: si falta una variable, docker compose se detiene
# con un mensaje (falla segura, CWE-798).
x-rabbitmq: &rabbitmq-base
  image: rabbitmq:3.13-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
    RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Defina_RABBIT_PASSWORD_en_.env}
    # misma cookie en ambos nodos: requisito para formar el cluster
    RABBITMQ_ERLANG_COOKIE: ${RABBIT_COOKIE:?Defina_RABBIT_COOKIE_en_.env}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 10

x-servicio: &servicio-base
  restart: unless-stopped
  profiles: ["app"]
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp

services:
  rabbitmq1:
    <<: *rabbitmq-base
    hostname: rabbitmq1
    container_name: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

  rabbitmq2:
    <<: *rabbitmq-base
    hostname: rabbitmq2
    container_name: rabbitmq2
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

  # Base de datos local (en produccion se usa AWS RDS)
  postgres:
    image: postgres:16-alpine
    profiles: ["app"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina_DB_PASSWORD_en_.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pedidos-service:
    <<: *servicio-base
    build: ./pedidos-service
    image: pedidos360/pedidos-service:local
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina_DB_PASSWORD_en_.env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      RABBIT_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Defina_RABBIT_PASSWORD_en_.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Forzar IPv4: la red de Docker no tiene IPv6 y Azure AD responde primero con IPv6
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  bff-service:
    <<: *servicio-base
    build: ./bff-service
    image: pedidos360/bff-service:local
    ports:
      - "8081:8081"
    environment:
      PEDIDOS_SERVICE_URL: http://pedidos-service:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Forzar IPv4: la red de Docker no tiene IPv6 y Azure AD responde primero con IPv6
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    depends_on:
      - pedidos-service

  rabbit-admin-service:
    <<: *servicio-base
    build: ./rabbit-admin-service
    image: pedidos360/rabbit-admin-service:local
    ports:
      - "8082:8082"
    environment:
      RABBIT_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Defina_RABBIT_PASSWORD_en_.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Forzar IPv4: la red de Docker no tiene IPv6 y Azure AD responde primero con IPv6
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      rabbitmq1:
        condition: service_healthy

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  postgres_data: