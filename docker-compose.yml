# Pedidos360 - entorno local / CI
#
#   docker compose up -d                                       -> solo cluster RabbitMQ de 2 nodos
#   docker compose --profile app up -d --build                 -> RabbitMQ + PostgreSQL + 3 microservicios
#   docker compose --profile kafka up -d                       -> cluster Kafka (3 Zookeeper + 3 brokers) + Kafka UI
#   docker compose --profile app --profile kafka up -d --build -> TODO el sistema (incluye analitica y admin Kafka)
#
#   Kafka UI: http://localhost:8090 | Brokers desde el host: localhost:29092, 29093, 29094
#
#   Nodo 1: AMQP 5672  | consola http://localhost:15672
#   Nodo 2: AMQP 5673  | consola http://localhost:15673
#
# Las credenciales se leen del archivo .env (copiar .env.example -> .env).
# Ya NO existen contrasenas por defecto: si falta una variable, docker compose se detiene
# con un mensaje (falla segura, CWE-798).
x-rabbitmq: &rabbitmq-base
  image: rabbitmq:3.13-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
    RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Defina_RABBIT_PASSWORD_en_.env}
    # misma cookie en ambos nodos: requisito para formar el cluster
    RABBITMQ_ERLANG_COOKIE: ${RABBIT_COOKIE:?Defina_RABBIT_COOKIE_en_.env}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 10

x-servicio: &servicio-base
  restart: unless-stopped
  profiles: ["app"]
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp

# --- Kafka: base comun de los 3 Zookeeper y de los 3 brokers ---
x-zookeeper: &zookeeper-base
  image: confluentinc/cp-zookeeper:7.7.1
  profiles: ["kafka"]
  restart: unless-stopped

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # ensemble de 3 nodos: con quorum de 2 sigue operando si cae 1
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

x-kafka: &kafka-base
  image: confluentinc/cp-kafka:7.7.1
  profiles: ["kafka"]
  restart: unless-stopped
  depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  # INTERNAL: trafico entre contenedores (kafkaN:9092) | EXTERNAL: desde el host (localhost:2909N)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # durabilidad y alta disponibilidad
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # los topicos se crean de forma controlada (kafka-init / kafka-admin-service), no por accidente
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # nunca elegir como lider a una replica desactualizada (evita perder datos)
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  rabbitmq1:
    <<: *rabbitmq-base
    hostname: rabbitmq1
    container_name: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

  rabbitmq2:
    <<: *rabbitmq-base
    hostname: rabbitmq2
    container_name: rabbitmq2
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

  # Base de datos local (en produccion se usa AWS RDS)
  postgres:
    image: postgres:16-alpine
    profiles: ["app"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina_DB_PASSWORD_en_.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pedidos-service:
    <<: *servicio-base
    build: ./pedidos-service
    image: pedidos360/pedidos-service:local
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina_DB_PASSWORD_en_.env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      RABBIT_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Defina_RABBIT_PASSWORD_en_.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Kafka (perfil "kafka"): si no esta levantado, el pedido igual se guarda y el error queda en el log
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      # Forzar IPv4: la red de Docker no tiene IPv6 y Azure AD responde primero con IPv6
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  bff-service:
    <<: *servicio-base
    build: ./bff-service
    image: pedidos360/bff-service:local
    ports:
      - "8081:8081"
    environment:
      PEDIDOS_SERVICE_URL: http://pedidos-service:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Forzar IPv4: la red de Docker no tiene IPv6 y Azure AD responde primero con IPv6
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      - pedidos-service

  rabbit-admin-service:
    <<: *servicio-base
    build: ./rabbit-admin-service
    image: pedidos360/rabbit-admin-service:local
    ports:
      - "8082:8082"
    environment:
      RABBIT_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Defina_RABBIT_PASSWORD_en_.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Forzar IPv4: la red de Docker no tiene IPv6 y Azure AD responde primero con IPv6
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      rabbitmq1:
        condition: service_healthy

  # ======================= Kafka: 3 Zookeeper + 3 brokers + Kafka UI =======================
  zookeeper1:
    <<: *zookeeper-base
    hostname: zookeeper1
    container_name: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1_data:/var/lib/zookeeper/data

  zookeeper2:
    <<: *zookeeper-base
    hostname: zookeeper2
    container_name: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2_data:/var/lib/zookeeper/data

  zookeeper3:
    <<: *zookeeper-base
    hostname: zookeeper3
    container_name: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3_data:/var/lib/zookeeper/data

  kafka1:
    <<: *kafka-base
    hostname: kafka1
    container_name: kafka1
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-base
    hostname: kafka2
    container_name: kafka2
    ports:
      - "29093:29093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29093
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-base
    hostname: kafka3
    container_name: kafka3
    ports:
      - "29094:29094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:29094
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # Crea los topicos con sus parametros de administracion y termina (ver kafka/crear-topicos.sh)
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    profiles: ["kafka"]
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    volumes:
      - ./kafka/crear-topicos.sh:/scripts/crear-topicos.sh:ro
    entrypoint: ["bash", "/scripts/crear-topicos.sh"]

  # Consola web para administrar brokers, topicos, particiones, mensajes y consumer groups
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["kafka"]
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      kafka1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      DYNAMIC_CONFIG_ENABLED: "true"

  # ======================= Microservicios Kafka =======================
  analitica-service:
    <<: *servicio-base
    profiles: ["kafka"]
    build: ./analitica-service
    image: pedidos360/analitica-service:local
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka-admin-service:
    <<: *servicio-base
    profiles: ["kafka"]
    build: ./kafka-admin-service
    image: pedidos360/kafka-admin-service:local
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      kafka1:
        condition: service_healthy

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  postgres_data:
  zookeeper1_data:
  zookeeper2_data:
  zookeeper3_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
