server.port=8081
spring.application.name=bff-service

# --- Validacion del JWT de Azure AD ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=82adc866-3948-44f8-993d-5658734ad794

# --- A donde reenvia el trafico (pedidos-service) ---
pedidos.service.url=${PEDIDOS_SERVICE_URL:http://localhost:8080}

# --- CORS (en AWS: CORS_ALLOWED_ORIGINS=https://tu-front) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Salud del servicio (Docker healthcheck / monitoreo) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Manejo de errores: nunca exponer trazas al cliente (CWE-209) ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
